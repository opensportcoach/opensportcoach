# Keeps dependencies patched: a pull request per update, tested by CI before anyone merges it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /app/web
    schedule: {interval: weekly}
    groups: {web: {patterns: ["*"]}}
    # Major versions (React, React Router, Vite…) change APIs: upgraded on purpose, in a PR of their own.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /app/channel
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
