name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python scripts/build_exercise_catalog.py
      - name: App dependencies
        run: |
          (cd app/web && npm ci)
          (cd app/channel && npm ci)
      - name: Leak scan (no personal data outside athletes/)
        run: .venv/bin/python scripts/leak_scan.py
      - name: Test suite (engine invariants against a fresh scaffold)
        run: .venv/bin/python tests/run_tests.py
