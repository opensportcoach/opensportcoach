name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python scripts/build_exercise_catalog.py
      - name: App dependencies
        run: |
          (cd app/web && npm ci)
          (cd app/channel && npm ci)
      - name: Leak scan (no personal data outside athletes/)
        run: .venv/bin/python scripts/leak_scan.py
      - name: Test suite (engine invariants against a fresh scaffold)
        run: .venv/bin/python tests/run_tests.py
